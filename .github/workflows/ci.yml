name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_python.py'
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: event-lanes-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 30
