<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python to Event Lanes</title><style>body{font:14px system-ui;max-width:1100px;margin:30px auto;padding:0 16px}pre{white-space:pre-wrap}</style><h1>Three Python tables → JSON → timeline</h1><button id="refresh">Refresh from Python</button><div id="timeline"></div><pre id="status" role="status"></pre><script type="module">
import {createTimeline} from '../../dist/index.js';
const timeline=createTimeline(document.getElementById('timeline'),{selectionMode:'group'});
timeline.on('selection',s=>document.getElementById('status').textContent=JSON.stringify(s,null,2));
let initialized=false,request=0;
async function refresh(){const n=++request;try{const r=await fetch('/api/timeline');if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();if(n!==request)return;timeline.setData(data);if(!initialized){initialized=true;timeline.selectGroup('recovery');timeline.fitTrace();}}catch(e){document.getElementById('status').textContent=String(e);}}
document.getElementById('refresh').onclick=refresh;await refresh();window.addEventListener('pagehide',()=>timeline.destroy(),{once:true});
</script></html>
