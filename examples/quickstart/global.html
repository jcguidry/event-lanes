<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Lanes quickstart</title><style>body{font:14px system-ui;max-width:1100px;margin:30px auto;padding:0 16px;color:#203b50}button{padding:8px;margin:4px}pre{white-space:pre-wrap;background:#f4f7fa;padding:14px}</style><h1>A generic event timeline</h1><p>Load → select a known group → trace → locate an effect → save the view.</p><button id="select">Select recovery</button><button id="locate">Locate completion</button><button id="save">Save view</button><button id="restore">Restore saved view</button><div id="timeline"></div><pre id="status" role="status"></pre><script src="../../dist/event-lanes.global.js"></script><script>const t=EventLanes.createTimeline(document.getElementById('timeline'),{selectionMode:'group'});let saved;fetch('./data.json').then(r=>r.json()).then(data=>{t.setData(data);t.selectGroup('recovery');t.fitTrace()});t.on('selection',s=>document.getElementById('status').textContent=JSON.stringify(s,null,2));document.getElementById('select').onclick=()=>t.selectGroup('recovery');document.getElementById('locate').onclick=()=>t.focusEvent('complete');document.getElementById('save').onclick=()=>{saved=JSON.stringify(t.getViewState());document.getElementById('status').textContent=saved};document.getElementById('restore').onclick=()=>{if(saved)t.restoreViewState(JSON.parse(saved))};window.addEventListener('pagehide',()=>t.destroy(),{once:true});</script></html>
